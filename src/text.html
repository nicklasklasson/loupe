<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Text</title>
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 10px; }
  h1 { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; margin: 0; }
  .state { color: var(--muted); flex: 1; }
  .state.ok { color: #1E7F4F; }
  .state.bad { color: var(--danger); }
  textarea {
    flex: 1; margin: 0 18px; padding: 10px 12px; resize: none;
    border: 1px solid var(--line); border-radius: var(--r-m); background: #fff;
    font: 13.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: text;
  }
  textarea:focus-visible { outline: 2px solid var(--brass); outline-offset: 0; }
  .loading { flex: 1; display: grid; place-items: center; color: var(--muted); }
  .loading .bar { width: 160px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 10px auto 0; }
  .loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--brass); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><h1>Text from screen</h1><span class="state" id="state"></span></header>
  <div class="loading" id="loading"><div>Reading text…<div class="bar"></div></div></div>
  <textarea id="text" spellcheck="false" hidden></textarea>
  <footer>
    <button id="close">Close</button>
    <button class="primary" id="copy" disabled>Copy</button>
  </footer>
<script src="text.js"></script>
</body>
</html>
