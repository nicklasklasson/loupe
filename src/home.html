<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Loupe</title>
<link rel="stylesheet" href="base.css">
<style>
  body { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  .capture {
    background: var(--sheet);
    border-right: 1px solid var(--line);
    padding: 28px 20px 20px;
    display: flex; flex-direction: column; gap: 6px;
    overflow: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 6px 22px; }
  .brand img { width: 30px; height: 30px; }
  .brand h1 { font-family: var(--font-display); font-size: var(--step-3); font-weight: 600; letter-spacing: -0.01em; margin: 0; }

  .action {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
    text-align: left; padding: 11px 12px; border-radius: var(--r-m);
    border: 1px solid transparent; background: transparent;
  }
  .action:hover { background: var(--paper); border-color: var(--line); }
  .action svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .action .label { font-size: var(--step-1); font-weight: 600; display: block; }
  .action .hint { color: var(--muted); font-size: var(--step--1); display: block; }
  .action.lead { background: var(--ink); color: #fff; padding: 14px 12px; margin-bottom: 6px; }
  .action.lead:hover { background: #2A3646; border-color: transparent; }
  .action.lead svg { stroke: var(--brass); }
  .action.lead .hint { color: #B7C1CE; }
  .action.lead kbd { background: transparent; color: #D8DEE6; border-color: #4A5667; }
  .action.record svg .dot { fill: var(--danger); stroke: none; }

  .secondary { margin-top: auto; padding-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .secondary button { flex: 1; }

  .notice {
    margin: 14px 0 0; padding: 10px 12px; border-radius: var(--r-m);
    background: #FFF6E3; border: 1px solid #EBD3A0; color: #5D4516; font-size: var(--step--1);
  }

  .library { display: flex; flex-direction: column; min-width: 0; }
  .library header {
    display: flex; align-items: baseline; gap: 12px; padding: 26px 28px 14px;
  }
  .library h2 { font-family: var(--font-display); font-size: var(--step-2); font-weight: 600; margin: 0; }
  .library .count { color: var(--muted); }
  .library header .spacer { flex: 1; }
  .library header button[hidden] { display: none; }
  .where { margin: -8px 28px 14px; color: var(--muted); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where span { color: var(--ink); user-select: text; }
  .fallback { margin: -4px 28px 14px; }
  .fallback[hidden] { display: none; }

  .grid {
    flex: 1; overflow: auto; padding: 4px 28px 28px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; align-content: start;
  }
  .tile { position: relative; border-radius: var(--r-m); cursor: pointer; }
  .tile .thumb {
    aspect-ratio: 16 / 10; border-radius: var(--r-m); overflow: hidden;
    background: #fff; border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .tile .thumb img, .tile .thumb video { width: 100%; height: 100%; object-fit: contain; background: #E4E8ED; }
  .tile:hover .thumb { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
  .tile .meta { padding: 7px 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .tile .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tile .kind { color: var(--muted); font-size: var(--step--1); }
  .tile .tools {
    position: absolute; top: 8px; right: 8px; display: none; gap: 4px;
  }
  .tile:hover .tools, .tile:focus-within .tools { display: flex; }
  .tile .tools button { padding: 3px 8px; font-size: var(--step--1); background: rgba(255,255,255,0.94); }
  .tile .badge {
    position: absolute; left: 8px; top: 8px; background: var(--ink); color: #fff;
    font-size: var(--step--1); padding: 1px 7px; border-radius: 4px;
  }

  .empty {
    grid-column: 1 / -1; margin-top: 8vh; justify-self: center; max-width: 380px; text-align: center; color: var(--muted);
  }
  .empty p { margin: 0 0 14px; font-size: var(--step-1); }
</style>
</head>
<body>
  <aside class="capture">
    <div class="brand"><img src="../assets/icon.png" alt=""><h1>Loupe</h1></div>

    <button class="action lead" id="region">
      <svg viewBox="0 0 26 26"><path d="M3 8V4.5A1.5 1.5 0 0 1 4.5 3H8M18 3h3.5A1.5 1.5 0 0 1 23 4.5V8M23 18v3.5a1.5 1.5 0 0 1-1.5 1.5H18M8 23H4.5A1.5 1.5 0 0 1 3 21.5V18"/><path d="M13 9v8M9 13h8"/></svg>
      <span><span class="label">Region</span><span class="hint">Drag to select an area</span></span>
      <kbd data-key="region"></kbd>
    </button>
    <button class="action" id="window">
      <svg viewBox="0 0 26 26"><rect x="3" y="5" width="20" height="16" rx="2"/><path d="M3 9.5h20"/><circle cx="6.2" cy="7.2" r=".4"/><circle cx="8.4" cy="7.2" r=".4"/></svg>
      <span><span class="label">Window</span><span class="hint">Pick an open window</span></span>
      <kbd data-key="window"></kbd>
    </button>
    <button class="action" id="fullscreen">
      <svg viewBox="0 0 26 26"><rect x="2.5" y="4" width="21" height="14" rx="1.5"/><path d="M9 22h8M13 18v4"/></svg>
      <span><span class="label">Full screen</span><span class="hint">The screen under your cursor</span></span>
      <kbd data-key="fullscreen"></kbd>
    </button>
    <button class="action record" id="record">
      <svg viewBox="0 0 26 26"><rect x="2.5" y="6" width="15" height="14" rx="2"/><path d="M17.5 11l6-3.5v11l-6-3.5"/><circle class="dot" cx="7" cy="10.5" r="1.8"/></svg>
      <span><span class="label">Record video</span><span class="hint">A screen, window or area</span></span>
      <kbd data-key="record"></kbd>
    </button>

    <div id="notice"></div>

    <div class="secondary">
      <button id="openFile">Open image…</button>
      <button id="paste">Paste image</button>
    </div>
  </aside>

  <section class="library">
    <header>
      <h2>Library</h2>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button class="quiet" id="resetFolder" hidden>Use default</button>
      <button class="quiet" id="chooseFolder">Change folder…</button>
      <button class="quiet" id="folder">Show folder</button>
    </header>
    <p class="where">Saving to <span id="where"></span></p>
    <p class="notice fallback" id="fallback" hidden></p>
    <div class="grid" id="grid"></div>
  </section>

<script src="home.js"></script>
</body>
</html>
