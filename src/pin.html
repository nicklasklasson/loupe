<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pinned capture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #29323E; cursor: grab; user-select: none; }
  body.dragging { cursor: grabbing; }
  img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .close {
    position: fixed; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: rgba(28, 36, 48, 0.8); color: #fff; font: 13px/22px system-ui, sans-serif;
    cursor: pointer; opacity: 0; transition: opacity 120ms; padding: 0;
  }
  body:hover .close { opacity: 1; }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(201, 146, 48, 0.9); opacity: 0; transition: opacity 120ms;
  }
  body:hover::after { opacity: 1; }
</style>
</head>
<body>
  <img id="img" alt="">
  <button class="close" id="close" title="Close (Esc)" aria-label="Close">✕</button>
<script src="pin.js"></script>
</body>
</html>
