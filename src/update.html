<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Loupe updates</title>
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; padding: 22px 24px 18px; gap: 12px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head img { width: 40px; height: 40px; }
  .head h1 { font-family: var(--font-display); font-size: var(--step-2); font-weight: 600; margin: 0; }
  .head .sub { color: var(--muted); font-size: var(--step--1); }
  #body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .line { font-size: var(--step-0); }
  .muted { color: var(--muted); font-size: var(--step--1); }
  .error { color: var(--danger); font-size: var(--step--1); }
  .notice { color: var(--brass-ink); font-size: var(--step--1); }
  .notes {
    flex: 1; overflow: auto; white-space: pre-wrap; user-select: text;
    background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-s);
    padding: 8px 10px; font-size: var(--step--1); line-height: 1.4; min-height: 48px; max-height: 120px;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--brass); width: 0; transition: width 200ms; }
  .busy { display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brass);
    animation: spin 0.8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--step--1); padding-top: 6px; border-top: 1px solid var(--line); }
  .foot input { margin: 0; }
  button.link { border: none; background: none; padding: 0; color: var(--brass-ink); text-decoration: underline; }
</style>
</head>
<body>
  <div class="head">
    <img src="../assets/icon.png" alt="">
    <div><h1>Loupe updates</h1><div class="sub" id="current"></div></div>
  </div>
  <div id="body"></div>
  <label class="foot"><input type="checkbox" id="auto"> Check for updates once a day (asks GitHub for the newest version; sends nothing else)</label>
<script src="update.js"></script>
</body>
</html>
