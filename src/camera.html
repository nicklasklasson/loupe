<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Camera</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .bubble {
    position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; cursor: grab;
    background: #1C2430; box-shadow: 0 0 0 3px #C99230, 0 6px 18px rgba(0,0,0,0.35);
  }
  .bubble.dragging { cursor: grabbing; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; pointer-events: none; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 18%; color: #D8DEE6; font: 12px/1.3 system-ui, sans-serif; }
  .tools { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); display: flex; gap: 6px; opacity: 0; transition: opacity 120ms; }
  body:hover .tools { opacity: 1; }
  .tools button {
    width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(28, 36, 48, 0.85); color: #fff; font: 13px/26px system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="bubble" id="bubble">
    <video id="video" autoplay muted playsinline></video>
    <div class="msg" id="msg" hidden></div>
    <div class="tools">
      <button id="size" title="Change size" aria-label="Change size">⤢</button>
      <button id="close" title="Hide camera" aria-label="Hide camera">✕</button>
    </div>
  </div>
<script src="camera.js"></script>
</body>
</html>
