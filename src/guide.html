<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Guide</title>
<link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 16px 24px;
    background: var(--sheet); border-bottom: 1px solid var(--line);
  }
  #title {
    flex: 1; min-width: 0; font-family: var(--font-display); font-size: var(--step-2); font-weight: 600;
    border: 1px solid transparent; border-radius: var(--r-s); padding: 4px 8px; background: transparent; user-select: text;
  }
  #title:hover { border-color: var(--line); }
  #title:focus { border-color: var(--brass); background: #fff; outline: none; }
  .meta { color: var(--muted); white-space: nowrap; }
  main { flex: 1; overflow: auto; padding: 24px; }
  .steps { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .step {
    display: grid; grid-template-columns: 40px 1fr; gap: 14px;
    background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px;
  }
  .num {
    width: 32px; height: 32px; border-radius: 50%; background: #E5484D; color: #fff;
    display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fields input, .fields textarea {
    border: 1px solid var(--line); border-radius: var(--r-s); padding: 7px 10px; background: #fff; user-select: text;
  }
  .fields input { font-weight: 600; font-size: var(--step-1); }
  .fields textarea { resize: vertical; min-height: 44px; font-family: var(--font); line-height: 1.45; }
  .fields input:focus, .fields textarea:focus { outline: none; border-color: var(--brass); }
  .shot { border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: #E4E8ED; cursor: zoom-in; }
  .shot img { display: block; width: 100%; height: auto; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row .spacer { flex: 1; }
  .row button { padding: 4px 10px; font-size: var(--step--1); }
  .danger:hover { color: var(--danger); border-color: var(--danger); }
  .status { color: var(--muted); font-size: var(--step--1); padding: 6px 24px; border-top: 1px solid var(--line); background: var(--sheet); min-height: 28px; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
</style>
</head>
<body>
  <header>
    <input id="title" aria-label="Guide title" maxlength="200">
    <span class="meta" id="meta"></span>
    <button class="quiet" id="folder">Show folder</button>
    <button id="html">Export web page…</button>
    <button class="primary" id="pdf">Export PDF…</button>
  </header>
  <main><div class="steps" id="steps"></div></main>
  <div class="status" id="status">Describe each step, then export. Edits are saved automatically.</div>
<script src="guide.js"></script>
</body>
</html>
